name: Verify Weft

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify profiles, docs, and skills
        run: ./scripts/verify.sh
      - name: Verify library builds and publication metadata
        run: ./gradlew verify

  verify-apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.2 for Firebase SwiftPM
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify SwiftPM façade
        run: swift test --package-path weft-live/iosInterop/WeftLiveKit
      - name: Verify Apple frameworks and Kotlin interop builds
        run: >-
          ./gradlew
          :weft-map:kakaomap:linkDebugFrameworkIosArm64
          :weft-map:kakaomap:linkDebugFrameworkIosSimulatorArm64
          :weft-login:compileKotlinIosArm64
          :weft-login:compileKotlinIosSimulatorArm64
          :weft-sensor:gps:compileKotlinIosArm64
          :weft-sensor:gps:compileKotlinIosSimulatorArm64
          :weft-push:linkDebugFrameworkIosArm64
          :weft-push:linkDebugFrameworkIosSimulatorArm64
          :weft-live:linkDebugFrameworkIosArm64
          :weft-live:linkDebugFrameworkIosSimulatorArm64
          :weft-live:compileTestKotlinIosSimulatorArm64
