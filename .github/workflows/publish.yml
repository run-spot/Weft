name: Publish Maven Central release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'weft-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: maven-central-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
      WEFT_DEVELOPER_EMAIL: ${{ vars.WEFT_DEVELOPER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.2 for Firebase SwiftPM
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish release to Maven Central
        run: |
          if [ -z "$WEFT_DEVELOPER_EMAIL" ]; then
            echo "WEFT_DEVELOPER_EMAIL repository variable must be set before publishing." >&2
            exit 1
          fi
          # Accept both the bare MAJOR.MINOR.PATCH tag and the historical weft-v prefix.
          case "$GITHUB_REF_NAME" in
            weft-v*) VERSION="${GITHUB_REF_NAME#weft-v}" ;;
            *) VERSION="$GITHUB_REF_NAME" ;;
          esac
          if [ -z "$VERSION" ] || ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must carry a MAJOR.MINOR.PATCH version: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          LIVE_RELEASE_ENABLED="$(awk -F= '$1 == "weftLiveReleaseEnabled" { print $2 }' gradle.properties | tr -d '[:space:]')"
          case "$LIVE_RELEASE_ENABLED" in
            true|false) ;;
            *) echo "gradle.properties must define weftLiveReleaseEnabled as true or false." >&2; exit 1 ;;
          esac
          ./gradlew "-PVERSION_NAME=$VERSION" "-PPOM_DEVELOPER_EMAIL=$WEFT_DEVELOPER_EMAIL" \
            "-PweftLiveReleaseEnabled=$LIVE_RELEASE_ENABLED" publishWeftReleaseToMavenCentral --no-configuration-cache
